body:
  text: 韻石齋筆談雜家類四雜品之屬提要臣等謹案韻石齋筆談二卷國朝薑紹書撰紹書有無聲詩史已著録是書仿周密雲煙過眼録記所見古器書畫及諸竒玩惟密書以收藏之人標題此書即以其物標題密書但記其名此書並詳其形模及諸家授受得失之始末其體例小異耳其天成太極圖一條不過石中圓理偶爾黑白相間遂執以駁朱子太極無形之説殊為迂謬延陵十字碑一條力辨孔子未嘗至吳之説引後世書墓志者不必皆至墓門為證然墓之建碑自是漢以下事越國數千里乞人表墓自是唐宋以下事以例三代殆恐不然至其辨黃氏文王鼎為附會博古圖辨天啓甲子所得玉璽非秦物辨河莊淳化帖為宋人所重刻非王著原摹辨句容崇明寺藏經有宋元祐五年張暉潘澤題名無斗神幻書之事辨宋徽宗山居圖董其昌誤以為王維辨宋藏經多仿蘇黃字體非必二人真迹皆鑿然有理其他亦多可資考證猶近代説部之可觀者其上卷祕閣藏書永樂大典名賢著述朝鮮人好書四條下卷晚季音樂白兔沙雞文臣玉帶四條雜説他事於全書為不類蓋隨筆記録偶失刋削以原夲所有仍並存之焉乾隆四十六年十二月恭校上總纂官臣紀的臣陸錫熊臣孫士毅總校官臣陸費墀韻石齋筆談原序人之所以衛身者道而已道之為物清寧平夷不尨不競故達人必於近道者寄吾意焉則氣不煩而慮澄視不壅而志曠然後可以居高明而康強也今之塗亦棘矣奔車蕩舟塵驚濤駭持顛不暇而晏如薑公獨能怡情於遊息之具風雅之林斯其度越儔俗為深逺也蓋公少而種學長益博綜竹書蝌蚪多所研究鍾王顧陸蘇米倪黃之流日與拱揖進退於几席之上故胸無俗趣口無鄙言雖當雄艷之劇而若忘乎人間神解玄契之若斯也昔嵗作噩舉國狂酣走權幸如鶩公獨先幾解組棄鳩署歸寂寥希夷以全其天彌復肆力於考鑒宅東有園林木蓊蔚溪流潺湲虛亭一楹幽翳不見日時與余把臂入焉撫殘楮掇斷縑推論得失搜考同異别白真贋有倫有脊意之所極夢亦同趣幾於昌歜之嗜者然而公知道者也玩物而不溺於物娛意而不滯於意於其所著韻石齋筆談見之舉其中數端如黃石以定鼎隕軀文泉以玉杯繫獄項氏以多藏被掠程生以善墨致傾乃至秦璽無救於陸沈唐錢悉燬於鑄局宋帖仍歸於煨燼凡以見多賄之焚身而金玉之非寶也盛衰之靡常而聚散之有數也物之尤者應如煙雲過眼斯言亮不欺我至於辨核精詳通涉淹雅特其餘事非公澄懷觀道之幽指耳時余寄席於公之鶴臯别業接公手札以所著見示且索敘言因述其大較如此同里蔣清序韻石齋筆談原序
