body:
  text: 韻石齋筆談雜家類四雜品之屬提要臣等謹案韻石齋筆談二卷國朝姜紹書撰紹書有無聲詩史已著録是書仿周宻雲烟過眼録記所見古噐書畵及諸竒玩惟宻書以收藏之人標題此書即以其物標題宻書但記其名此書並詳其形模及諸家授受得失之始末其體例小異耳其天成太極圖一條不過石中圓理偶爾黒白相間遂執以駁朱子太極無形之説殊為迂謬延陵十字碑一條力辨孔子未嘗至吳之説引後世書墓誌者不必皆至墓門為證然墓之建碑自是漢以下事越國數千里乞人表墓自是唐宋以下事以例三代殆恐不然至其辨黄氏文王鼎為附㑹博古圖辨天啟甲子所得玉璽非秦物辨河莊淳化帖為宋人所重刻非王著原摹辨句容崇明寺藏經有宋元祐五年張暉潘澤題名無斗神幻書之事辨宋徽宗山居圖董其昌誤以為王維辨宋藏經多仿蘇黄字體非必二人真迹皆鑿然有理其他亦多可資考証猶近代説部之可觀者其上卷秘閣藏書永樂大典名賢著述朝鮮人好書四條下卷晚季音樂白兎沙雞文臣玉帯四條雜説他事於全書為不類盖隨筆記録偶失刋削以原夲所有仍並存之焉乾隆四十六年十二月恭校上總纂官臣紀旳臣陸錫熊臣孫士毅總校官臣陸費墀韻石齋筆談原序人之所以衞身者道而已道之為物清寧平夷不尨不競故達人必於近道者寄吾意焉則氣不煩而慮澂視不壅而志曠然後可以居高明而康强也今之塗亦棘矣奔車蕩舟塵驚濤駭持顛不暇而晏如姜公獨能怡情於游息之具風雅之林斯其度越儔俗為深逺也葢公少而種學長益博綜竹書蝌蚪多所研究鍾王顧陸蘇米倪黄之流日與拱揖進退於几席之上故胸無俗趣口無鄙言雖當雄艶之劇而若忘乎人間神解𤣥契之若斯也昔嵗作噩舉國狂酣走權倖如鶩公獨先幾解組棄鳩署歸寂寥希夷以全其天彌復肆力於攷鑒宅東有園林木蓊蔚溪流潺湲虚亭一楹幽翳不見日時與余把臂入焉撫殘楮掇㫁縑推論得失搜攷同異别白真贗有倫有脊意之所極夢亦同趣幾於昌歜之嗜者然而公知道者也翫物而不溺於物娱意而不滯於意於其所著韻石齋筆談見之舉其中數端如黄石以定鼎隕軀文泉以玉杯繫獄項氏以多蔵被掠程生以善墨致傾乃至秦璽無救於陸沈唐錢悉燬於鑄局宋帖仍歸於煨燼凡以見多賄之焚身而金玉之非寳也盛衰之靡常而聚散之有數也物之尤者應如烟雲過眼斯言亮不欺我至於辯覈精詳通涉淹雅特其餘事非公澂懷觀道之幽指耳時余寄席於公之鶴臯别業接公手札以所著見示且索敘言因述其大較如此同里蔣清序韻石齋筆談原序
