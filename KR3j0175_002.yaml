body:
  text: 韻石齋筆談卷下丹陽薑紹書撰延陵十字碑曲阿延陵里季子墓在焉夫子書十字碑曰嗚呼有吳延陵君子之墓籀體竒偉冠絶古今且石碣巨麗足表聖謨碑陰張從申書圓潤遒逸輝映翠琰淳化閣帖亦勒孔書十字小如彈丸不類豐碑之製此必王著輩欲藉先聖之迹以重閣本乃縮而小之若玉枕蘭亭耳或謂孔子未嘗至吳是否俱不可考此豈其然蓋夫子於昔讓國諸賢未嘗不心儀而神合焉故稱泰伯曰至德稱夷齊曰得仁兹則稱季札曰君子因嗟悼其亡而表揚其墓夫復奚疑今之人欲志壙石尚不逺千里而徵文豈秉筆者皆造墓門方染翰邪唐李陽冰書篆初學嶧山碑後見孔書季札墓字便變化開合如虎如龍徑利豪爽風行雨集是知陽冰之篆法得所宗矣聖教序附述聖記唐玄奘法師貞觀三年八月往五印度取經至十九年正月復至京師先翻瑜珈師地論成進御太宗製大唐三藏聖教序褒之皇太子治又製述聖記有𢎞福寺沙門懷仁集王右軍字勒二文於石今考序內自顯揚聖教起其文乃高宗在青宫時所述葩藻典雅可與太宗序頡頏豈即所謂述聖記邪鴈塔初成褚遂良書二帝記序鐫兩碑置塔間自是鴈塔為進士題名及遊人燕集之所褚河南聖教序碑乃永徽四年十二月建較之懷仁集右軍書更覺風骨清徑匠心獨運尤為可珍瘞鶴銘瘞鶴銘在焦山斷崖中筆法之妙為書家冠冕今已剝蝕於驚濤怒浪不復存其髣佛矣論者以華陽真逸為顧況道號又以為王逸少書又以為陶貞白書又以為唐人王瓉書紛紛揣摩奚啻蘭亭聚訟余審其結體蒼徑楷𨽻相參且銘詞古雋其出於六朝名手無疑嵗久石泐傳諸簡册者文多缺略友人徐若水有唐摹本乃是全文余喜而録之瘞鶴銘井序華陽真逸撰鶴壽不知其紀也壬辰嵗得於華亭甲午嵗化於朱方天其未遂吾翔寥廓邪奚奪之遽也乃裹以玄黃之幣藏乎兹山之下仙家有立石旌事篆銘不朽詞曰相此胎禽浮丘著經乃徵前事出於上真余欲無言紀爾嵗辰玄門去鼓華表留聲我惟髣佛事亦微冥爾將何之解化惟寧後蕩洪波前固重扃右割荆門未下華亭爰集真侣瘞爾作銘上皇樵人逸少書夆山徵士丹陽外仙尉江隂真宰立石升元帖宋太宗萬幾之餘留意翰墨淳化三年出御府所藏墨迹命侍書王著鏤板禁中集為法帖十卷惟大臣登二府者得賜故法帖譜系以閣本為祖然江南李後主命徐鉉以所藏古今法帖入石名升元帖此在淳化以前當為法帖之祖按石刻三代及秦漢即有之皆豐碑及磨崖也法帖之成帙而可置案頭者自升元淳化帖始紹興米帖宋高宗聽政之暇垂情文藻嘗自書禮部韻略五卷如千尺文錦卷舒有餘於米元章書尤所篤好紹興辛酉集元章墨迹刻之禁中余得宋拓第三卷於袁寰中皆擘窠書秀偉竒傑掩映縹緗河莊淳化帖淳化閣帖碑板不知何年入於禁中正德間吾邑河莊七峯孫中翰好古博雅遊於京師頗善內臣蕭敬武宗翠華巡幸敬常居守其時功令頗寬敬引七峯觀大內至一小殿見殿角堆積碑板七峯諦視之徘徊不去敬曰內庭萬尸千門即西苑一隅非竟日可歷君津津於朽木何為者哉七峯曰此宋刻淳化帖也余愛其結體清拔轉折飛動有風旋電激之勢冠絶外庭諸本是以觀耳敬謂子欲之乎當為謀之孫謝不敢敬有心人也亦善草書嵗暮大雪傳旨掃除敬啓御前云內庭有廢材并宜移出帝可其奏敬即以帖板致之七峯七峯驚喜逾涯以錦囊密貯攜之歸里當時善書如文徵仲祝希哲諸公鑒定可與宋拓閣帖方駕求者填門吳中為之紙貴京口楊文襄與孫為姻家戒之曰碑板出自禁庭紛紛傳拓倘為人指摘禍且叵測竊為君危之七峯篤好此板不忍付之水火亟以原拓另刻十卷以應求者謂之二號帖宋刻則稱上號焉後因家僮夜博不戒於火兩本俱失流傳人間者真同吉光片羽而上號尤為賞鑒家所重淳化間太宗以前代墨迹命王著鏤板禁中集為閣帖十卷非登二府者不得賜人間以官帖為難得其拓用李廷圭墨色濃而無銀錠紋者上也後來板漸拆裂墨色稍淡有銀錠紋者次也河莊帖標格清徑結體圓密有純綿裹鐵之致無銀錠紋此乃宋刻上乘而非王著所摹明矣至於次號存為評腳可也孫氏曾經倭變帖傳稀如星鳳其上號將與宋拓並驅非上海顧氏本所可望也陸文裕云蘭亭無下拓吾於閣帖亦云陳少陽綸誥吾邑陳少陽先生蚤有雋聲俶儻負氣丹誠貫日九死不移於欽宗高宗兩朝疾邪秉正屢上彈文劾蔡京王黼朱勔童貫黃潛善諸姦鷹鸇之擊不遺餘力終遭潛善搆陷與歐陽徹同斬於市紹興四年思陵追悔前非贈先生朝奉郎祕閣修撰所頒誥軸尚藏其家先孝廉曾刻之石今録於左以存桑梓典故其文曰嗚呼古之人願為良臣不願為忠臣以為良臣已荷美名君都顯號忠臣身嬰禍誅君陷昏惡嗚呼惟爾東爾徹其殆將有意欲為忠臣乎繇朕不德使爾不幸而不為良臣也雖然爾藉不得已不失為忠而顧天下後世獨謂朕何此朕所以八年於兹一食三歎而不能自已也通階美職豈足為恩以塞豫哀以彰豫過使天下後世考古之飾非拒諫之主殆不如是魂而有知享朕兹意北斗書藏經辨句容崇明寺有斗書藏經年久散落人間楮素完好展之墨色映人眼睫信毗盧法寶也相傳寺僧欲延請名流書經滿藏忽有全真七人至寺俱渥顔飄髯風度沖逺謂僧曰吾能書此何必倩人主僧允之扃閉一室至明啓扉閴無其人止有七鴿沖霄而去剡藤貝葉繕寫無遺鋒頴端莊如出一手始悟北斗神顯化建齋以謝余舞象之年聞其説而異之留意採訪後先凡得三卷皆朱絲界行紙瑩潔如玉書體頗類眉山其一為大雲經宋元祐五年庚午七月錢塘張暉書其一為般若經亦庚午年張暉書其一為法輪經元祐五年庚午七月闕山潘澤書想元祐庚午乃寫經起首之期也姓名嵗月班班可考何乃神其説而謂北斗降靈之迹乎徽宗高士圖徽宗模衛賢高士圖贉首瘦金御書所圖高士展對間鬚睂生動儼若古賢晤語後有蔡京題跋崇禎壬申余見於燕邸無十五城之價不能留之每往來於懷不勝趙明誠牡丹圖之感不知何由轉徙吳中為韓古洲所得己卯秋日余會古洲於京口追述燕中所見古洲掀髯曰世兄欲觀此卷乎余曰長安逺在日邊止可作京華客夢耳古洲即於行笈中取出此卷暨黃庭內景經皆烜赫名迹內景經亦有宣和小璽兹卷印記若合符節余既出春明門自分永隔高士儀表何期復見於古洲書畫舫中憮然如遇古人也危樓日暮余於金陵見册頁一帙上多名迹中有山居圖一幅諦視之乃宣和御筆丘壑全法王右丞御題左方云危樓日暮人千里欹枕秋空一鴈聲董文敏鑒定為王摩詰非也蓋宣和內府所藏多右丞真迹帝薰習之久故渲染似之宣和宸翰乍覺生風喜雨涼農家得地發田穰却緣暑退秋光滿點滴高梧似漏長右宣和殿書為鶴林寺僧藏憲聖皇后翰藻宋憲聖慈烈皇后吳姓高宗之配工於詞翰書法絶類高宗四明樓璹為於潛令繪耕織圖進呈農事自浸種至登廩凡二十有一蠶事自浴種至剪帛凡二十有四逐段有憲聖題字余曾見后題徐熙牡丹圖云吉祥亭下萬千枝看盡將開欲落時却是雙紅有深意故留春色緩人思題芍藥云穠李夭桃掃地無眼明驚見玉盤盂揚州省識春風面看盡羣花總不如楊妹子楊妹子乃宋寧宗恭聖皇后妹其書類寧宗凡御府馬逺畫多令題詠余曾見馬逺松院鳴琴小幅楊娃題其左方云間中一弄七絃琴此曲少知音多因淡然無味不比鄭聲淫松院靜竹樓深夜沉沉清風拂軫明月當軒誰會幽心詞寄訴衷情波撇秀頴妍媚之態映帶縹緗山谷書法華經辨戊子夏日觀張修羽所藏黃山谷書法華經七卷以朱絲界行楮素精好真宋迹也然斷以為涪翁書則不能無疑結體雖出雙井頗乏靈骨秀韻嘗閲蘇黃墨迹即赫蹄數行未有不識欵及嵗月者豈手書至七卷之多而不落一欵不鈐一印恐涪翁之鏟迹逃名不至是也此必趙宋高僧深於黃體者所書若李懷琳之倣嵇叔夜耳余每見宋書藏經結體多是眉山形模宛肖若遽謂東坡真迹則不然矣修羽所藏乃檀那珍品而非墨池竒迹徐若水有趙文敏書法華經七卷乃三懷講師故物後多名人題跋雖有子昂欵余亦謂非趙筆凡名賢書以韻為主字如算子了無天趣何能上下五百年縱橫一萬里哉米海嶽畫米海嶽人物英邁裁鑒清深翰繪軼羣有邁往凌雲之致所寫雲煙山樹雖宗王洽潑墨實法董源皴染且其臨摹古畫往往亂真圖晉唐間忠臣義士像得顧陸標格自寫海嶽菴及淨名齋圖巗壑深秀曾於紙上橫寫松稍針芒千萬攢錯如鐵又自寫照三本其一藏紹興御府想寶晉齋中盤礴之迹必有極精工者其墨戲雲山乃米畫之一種耳郭河陽御屏粉本古之畫藁謂之粉本不經意處天真爛漫生趣勃然良足珍重余見郭河陽玉華殿屏風圖兼李營丘董北苑風骨熙寧間奉旨畫玉華殿後苑御屏經營畫格以應宣召乃粉本之佳者欵則八分書結體古雅生平僅見界畫樓閣述附髮繡畫家宫室最難為工須位置無差乃稱合作世傳界畫之工緻者咸目之為李將軍殊不知唐之尹繼昭五代之胡翼衛賢皆擅國能至郭恕先而人品既高搆思精密遊於規矩凖繩中而不為所窘余曾見其避暑宫圖千榱萬桷纖毫不遺誠行家絶藝也勝國王孤雲能接武恕先而更加細潤其仙山樓閣及端陽競渡圖結搆邃密筆若懸絲刻畫精整幾無剩義其徒李公又其次也復有夏永字明逺者以髮繡成滕王閣黃鶴樓圖細若蚊蝶侔於鬼工唐季女仙盧眉娘於一尺絹上繡法華經七卷明逺之製庶幾近之余遍考博雅家言無所謂夏明逺者絶技如此而姓字不傳可乎因附著之精於界畫者不但以筆墨從事兼通木經算法方能為之空繡之製至明已失其傳若仇十洲之精工秀麗幾於棘猴玉楮然須規撫舊本方能譽擅出藍非匠心獨運也嘗觀吳文中所畫臺榭車馬種種臻妙即復閣重樓次第不紊北宋畫格於此君尚存典型且兼人物山水非若恕先孤雲之専門宫室也黃子久天池石壁圖黃子久畫舊筆之韻溢於毫素為士氣建幢石田玄宰兩先生繪事由此發脈此天池石壁圖乃烜赫有名之迹流傳多贋本其真迹舊藏金沙王宇泰家董思翁於萬厯甲辰嵗遊茅山過訪宇泰批閲此圖極其欣賞以為煙雲生動林壑虛間誠篤論也𢎞光間余與董長公孟禮同仕於朝獲觀其所攜書畫亦有天池石壁圖經思翁標題與此敻異殊乏蒨秀之色故容臺集評石壁圖不大許可蓋指所授孟禮本也董公見法書名畫隨筆品題即為人藏弆鑒裁餘韻往往散現於金題玉躞中集之所載十一耳若以評駁别本之語強擬此圖不為黎丘之恨者幾希黃子久畫國朝繪事不啻家驥人璧矣至於氣韻生動應推沈石田董玄宰遡兩公盤礴之源俱出自黃子久子久畫秀潤天成每於深逺中見瀟灑雖博綜董巨而靈和清淑逸羣絶倫即雲林之幽淡山樵之縝密不能勝也當時松雪雖為前輩惟以精工佐其古雅第能接軫宋人若夫取象於筆墨之外脫銜勒而抒性靈為文人建畫苑之幟吾於子久無間然矣今之畫史稍知舐筆輒署欵云倣大癡此不過望塵逐影已耳亦曾窺其遺迹之一斑否乎然不如是不足以見子久畫道之𢎞逺也論曰昔人謂書能使人逺非逺心人烏能辦此子久每欲濡毫則登高樓望雲霞出沒以挹其勝故其所寫逸氣磅礴風神玄逺千載而下猶足想見其人世傳八十六不知所終皆以為仙去云子昂子固畫品觀子昂畫泓潁秀拔嫣然宜人如王孫芳草欣欣向榮觀子固墨梅水仙則雪幹霜枝亭亭獨立如嵗寒松柏歷變不離志士寧為子固弗為子昂王叔明叔明為趙文敏甥畫師王右丞書法鍾太傅不涉鷗波蹊徑然靈秀之韻得之宅相為多極重子久奉為師範一日子久至齋中焚香瀹茗從容出已得意畫請教子久為山樵從其匠心處復加點染為林巒秋色圖遂覺煙雲生動世傳為黃王合作倪雲林雲林畫以荆浩為宗蕭蕭數筆神仙中人也間有林壑似李成而寫人物及著色者百中之一耳其盤礴之迹寓深逺於玄淡清穎瀟灑得自先天非後人所能髣佛梅道人余見元畫揮染之餘題詠於幀首者不一而足鳳翥鴉塗妍媸並列亦是文人習氣惟梅道人畫秀徑拓落運斤成風欵則墨瀋淋漓龍蛇飛動即綴以篇什亦摩空獨運旁無贅詞正如獅子跳躑威震林壑百獸斂迹尤足稱尊董文敏孫文介書品阮千里善彈琴人聞其能多往求聽不問貴賤老幼皆為彈之神氣沖和不知向人所在余曰此董文敏書品也戴安道亦善鼓琴武陵王晞使人召之安道對使者破琴云戴安道不作王門伶人余曰此孫文介書品也然安道之峻不如千里之達書家餘派晉唐而下書家烜赫者無如蘇長公趙松雪董玄宰然三公同時皆有臨池餘派以演其傳如優孟之於叔敖抵掌談笑併其神情似之能倣東坡書者則有高述述丹陽人名不甚朗朗與坡公同時書法惟肖乃附之以傳子昂傳燈則有郭天錫天錫名畀京口人嘗手書松雪齋詩一帙遒逸精緊宛入鷗波三昧其他詩文題跋散見於卷册中駸駸與松雪並驅元季工趙體者未能或之先也玄宰門下士則有吳楚侯楚侯名翹後改名易以能書薦授中翰為諸生時思翁頗拂拭之書稱入室弟子崇禎癸酉余遊燕都適思翁應宫詹之召年八十餘矣政務間簡端居多暇余時過從而楚侯恆左座隅長安士紳祈請公翰墨無虛日不異素師鐵門限公倦於酬應則倩楚侯代為之仍面授求者各滿志以去楚侯之寓堆積綾素更多於宗伯架上焉雖李懷琳之擬右軍不是過也惟知交之篤及賞鑒家公乃自為染翰耳此三人者皆親炙名賢而八法之緒如嵗之有閏焉項墨林收藏項元汴墨林生嘉靖隆慶之世資力雄贍享素封之樂出其緒餘購求法書名畫及鼎彛竒器三吳珍祕歸之如流王弇州與之同時主盟風雅搜羅名品不遺餘力然所藏不及墨林逺甚墨林不惟好古兼工繪事山水法黃子久倪雲林蘭竹松石饒有别韻每得名迹以印鈐之纍纍滿幅亦是書畫一厄譬如石衛尉以明珠精鏐聘得麗人而虞其他適則黥面記之抑且遍黥其體使無完膚較蒙不潔之西子更為酷烈矣復載其價於楮尾以示後人此與賈豎甲乙帳簿何異不過欲子孫長守縱或求售亦期照原直而請益焉貽謀亦既周矣百餘年來嘉禾被燹項氏纍世之藏盡為千夫長汪六水所掠蕩然無遺詎非枉作千年計乎物之尤者應如煙雲過眼觀可也火浣布東方朔神異經所載南荒之外有火山書夜火然其中有鼠重百餘斤毛長二尺許可作布鼠常居大火中時出外以水逐而沃之方死取其毛緝織為布或垢浣以火則淨魏文帝常著論謂世言異物皆未必真有之至明帝時有以火浣布至者是知天壤間何所不有耳目未接固未可斷以為必無也戊子嵗友人高文伯自金陵來示余火浣布一方色微白以手撫之則餘粉染指如弄蝶翅投之熾火中移刻布與火同色然後取出則潔白如故了無所損嗅之微有羶氣正類鼠毛織成開元錢余幼時見開元錢與萬厯錢參用輪廓圓整書體端莊間發青緑硃斑古雅可玩峕有指甲痕相傳楊妃以爪拂蠟模形如新月天啓三年南工部郎白紹光職掌鼓鑄建議前朝舊錢非時王之制不應互用致錢壅滯悉宜追毁以裕國儲大司空以為能嚴禁民間無得以開元錢貿易凡有存者俱作廢銅歸爐改鑄白君雖一時之見規畫利權遂使八百餘年流傳泉貝銷於煙燼深可痛惜晚季音樂崇禎末年不惟文氣蕪弱即新聲詞曲亦皆靡靡亡國之音阮圓海之所度燕子箋春燈謎雙金榜牟尼合諸樂府音調旖旎情文宛轉而憑虛鑿空半是無根之謊殊鮮博大雄豪之致楊仲修見周藩樂器因創為提琴哀絃促柱佐以簫管僮子以曼聲和歌纒綿悽楚如泣如訴聽之使人神情一往蕭索聲音之道關於氣運豈曰偶然白兔白兔瑞物也有一種相類者來自閩廣畜其雄雌頗能生育遇竹木器則嚙之如鼠損物識者曰此沙鼠也宋祚將終此物頗多崇禎末亦然今則罕覩矣絲燈記略絲燈之製始於雲南𢎞治間邑人潘鳳號梧山善丹青有巧思隨楊文襄公至滇中見料絲燈悅之歸而煉石成絲如式倣製於是丹陽絲燈達於海內佘歷北平金陵維揚蘇杭素稱繁華之地屢逢燈節遍閲千門火樹碧映珠輝訪及雲南絲燈稀如星鳯豈因梯航萬里艱於郵致乎燈雖種種唯料絲之光皎潔晶瑩不啻明珠照乘寰中之點綴上元者曲阿稱最焉近日里中王又玄巧翻新樣鏤玉裁雲妍雅精工出人意表可稱絶技然梧山乃造燈鼻祖云宋硯建炎己酉宋髙宗避兵航海凡上方所儲貢硯載以自隨拍浮滄波徘徊島嶼於斯時也風鶴傳警陽侯震蕩隨行舳艫往往飄沒硯之淪於波臣者不知凡幾厥後漁人蛋户偶或得之流傳閩廣奚啻天吳紫鳯嘉靖間福建許姓者常估於姑蘇過文徵仲玉蘭堂見案上一硯文頗珍重許曰此硯閩廣是處有之文笑曰此宋貢硯也乃端溪舊坑豈易得哉許知其説逾嵗即攜宋貢硯二十方過姑蘇文見大駭因歎至寶何以若是之多也文易其四士人爭購之頗得髙價嘉靖乙卯許復攜三十方欲仍往姑蘇以覬厚直時海上倭冠猖獗乃客於金陵為都中士大夫所貿詢其所自皆由古寺中得之或見於鄉村訓孰蓋宋室將衰遷於南海故閩粵是處有之不但髙宗所攜也墨考古延州石墨可磨汁而書晉陸雲與兄箋云三臺上藏曹公石墨數十萬斤燒之可用然煙觀此語則石墨未必可磨亦如松節之然脂作墨也至漢始有隃糜之名唐始有松煙之製至李廷圭始用腦麝張遇始用金箔廷圭父超乃奚姓唐末與其子自易水徙居於歙遂為歙人南唐賜姓李氏則歙墨之源其來久矣圭弟廷寬寬子承宴宴子文用皆世其業唐則祖敏奚鼎奚鼐陳朗王君得宋則潘谷潘衡張遇朱知常葉茂實葉世英劉士先皆良工也宣和帝以蘇合油搜煙和墨雜以百寶金章宗購之每兩值黃金一斤欲倣不能歎為墨妖紹興間髙宗命戴士衡造復古殿墨識以雙角龍文乃侍郎米友仁筆宋多右文之主而徽廟思陵稱最焉元朱萬初全用松煙蓋取二三百年摧朽之餘精華不泯者育日月而飽風霜非凡材也虞奎章贈以詩云霜雪摧殘澗壑非深根千嵗斧斤違寸心不遂飛煙化還作玄雲繞紫微國朝則方正邵格之羅小華皆擅能墨藪小華名龍文新安人嚴分宜當國為其子大符幕賔授中書舍人嚴敗伏法所製墨糜玉屑金珠以為珍異神宗遊情翰藻訪及羅氏墨中涓重資爭購等於圭璧焉厥後織造內臣孫隆製精謹堂墨欵式精巧劑料極一時之選曾進尚方神宗愛重之新安方於魯程君房以治墨互相角勝方所彚墨譜倩名手為圖刻畫妍精細入毫髮程作墨苑以矯之兩家遺編至今傳為清玩蓋於魯微時曾受造墨之法於君房仍假館而授粲焉程有妾頗美麗其妻妒而出之正方所慕也乃令媒者展轉謀娶程訟之有司遂成隙末未幾程坐殺人繫獄疑方隂嗾之故墨苑內畫中山狼傳以詆方然以墨品人品論程終不能勝方耳趙駕部青陽造遙香草堂墨可與方程並驅近時吳去塵頗以墨稱余在金陵見去塵墨真者十一贋者十九錦囊漆匣徒以眩觀於臨池奚當焉墨考緒言蓋自蝌蚪漆書變為𨽻體而墨尚矣莊子謂宋元君將畫衆史皆至舐筆和墨漢尚書令僕丞郎月給隃糜墨大小二枚至韋仲將而搗煙和膠之法始備蕭子雲云仲將之墨一點如漆想不虛也有祖氏者居易水為唐之墨官雖他氏之墨必藉其姓而傳之廷圭之父奚超亦易水人也故易水之墨以久特聞若太行濟源王屋亦多佳墨焉古法煙必松焰膠必糜角蓋墨工之良咸萃於名山大川明興新都獨以墨鳴他方無能勝之者余嘗試宣廟龍香但馥而不黝尚遜新都中駟也詎非珠麝浮於桐燼乎昭代硯不及唐箋不及宋即筆亦無宣州毫之圓雋惟墨之道超潘駕李差足為藝林吐氣余縱不工八法每遇名墨則喜而藏之雖蹈李公擇磨人之誚所不辭耳石墨出南雄府始興縣沈散小溪巨細短長一如墨式以端硯發之可寫字可畫睂韻石齋筆談卷下
