body:
  text: 韻石齊筆談卷上丹陽姜紹書撰天成太極圖余祖養訥公乃石雲孫先生館甥曾隨石雲過鬻古之肆見一圓石瑩潤精彩搖之則中空而有聲孫君疑為璞玉以數鐶易之命玉工剖開乃天成太極圖也黑白分明陰陽互位邊縈紅線絢若明霞天地靈竒藴於此石濓溪圖之於先石雲剖之於後較河圖洛書更為明顯因知世有此理即有此象朱子謂太極無形是未覩此神物耳是圖石雲傳於乃子龍池龍池弗克象賢僅得百金售於楊文襄公之孫鶴慶君以襲廕詣京饋分宜嚴相嚴氏籍沒已入內府祕閣藏書內府祕閣所藏書甚寥寥然宋人諸集十九皆宋板也書皆倒摺四周外向故雖遭蟲鼠嚙而未損但文淵閣制既庳狹而牖復暗黑抽閲者必秉炬以登內閣輔臣無暇留心及此而翰苑諸君世所稱讀中祕書者曾未得窺東觀之藏至李自成入都付之一炬良可歎也楊文貞士竒有文淵閣書目十四卷此乃永樂至宣德間所裒後漸散逸不能如舊數矣永樂大典成祖敕儒臣纂修永樂大典一部係胡廣王洪等編輯徵召四方文墨之士纍十餘年而就計二萬二千八百七卷一萬一千九十五冊目録六十卷因卷帙浩繁未遑刻板止寫原本至𢎞治間藏之金匱嘉靖某年大內回祿世宗亟命那救書幸未焚敕閣臣徐文貞階復令儒臣照式摹抄一部當時供謄寫者一百八名每人日抄三頁自嘉靖四十一年起至慶隆元年始克告竣名賢著述昭代藏書之家亦時聚時散不能悉考就其著述之富者可以類推時則有若宋文憲濓劉誠意基楊文貞士竒李文正東陽王文恪鏊吳文定寬史明古鑑陸文裕深程篁墩敏政丘文莊濬邵文莊寶楊文襄一清林見素俊王文成守仁楊升菴慎李空同夢陽顧東橋璘文衡山徵明楊南峰循吉鄭淡泉曉雷司空禮王鳳洲世貞王麟洲世懋唐荆川順之先少保鳳阿諱寶薛方山應旗李滄溟攀龍馮北海琦黃葵陽洪憲胡元瑞應麟何元朗良俊茅鹿門坤焦淡園竑顧鄰初起元袁中郎宏道王損菴肯堂屠赤水隆湯若士顯祖李溫陵贄董文敏其昌何士抑三畏陳眉公繼儒馮元成時可李本寧維楨馮具區夢禎黃貞甫汝亨朱平涵國禎李君實日華謝在杭肇浙鍾伯敬惺陳明卿仁錫文湛持震孟俞容自彥張天如溥以上諸公皆當世名儒翺翔藝苑含英咀華尚論千古其所儲典籍縱未必有張茂先之三十乘金樓子之八萬卷然學海詞源博綜有自亦可見其插架之多矣朝鮮人好書朝鮮國人最好書凡使臣入貢限五六十人或舊典或新書或稗官小說在彼所缺者日出市中各寫書目逢人遍問不惜重直購回故彼國反有異書藏本也余曽見朝鮮所刻皇華集乃中朝冊封使臣與彼國文臣唱和之什鏤板精整且繭紙瑩潔如玉海邦緗帙洵足稱竒文王鼎附彛爐雷紋觚修吾李公節鎮淮陰博綜竒玩遣中翰黃黃石羅致名品以千三百金得文王鼎於梁溪嵇少峰家曾挂彈章於是寶鼎之名聞天下逮修吾物故乃郎視為常物此鼎仍歸黃石黃又别購彛爐花觚蔚為三絶雄視飛鳬韓太史芹城見而愛之徘徊歎賞幾同米顛禮石𢎞光間黃石流寓曲阿賀日獻為居停主笈中所攜咸寄賀室日獻於黃石固有乳水之契然雅玩非其好也黃石懋遷起家雖仕至璽卿而㑹計之精微羣賈推為領袖日獻素擁厚資牙籌營運惟日孳孳兩意相孚賀出千金授黃將列肆於金閶而逐什一也不意黃石届蘇而殁賀往弔唁兼理前資伊妾程姬匿之償以古玩於是彞鼎花觚悉為賀有乙酉夏日余避暑於先宗伯義莊與日獻家密邇恆過晤言因出三器示余鼎方而淺四面飛戟足鏤蜼文觚則雷紋細花翠色欲滴為周器無疑彛則上下花紋兩瓣乃漢器也芹城注念此鼎多方求購賀意將允韓適北轅因而中止韓太史遇王憲副仲和於燕邸贊述此鼎詫為希覯仲和心儀之憲副乃覺斯先生弟與余留都有傾蓋之雅戊子嘉平月赴任金衢停驂過晤兼詢鼎藏何所余酬帖於郵亭出觀王摩詰山水一軸李希古萬松金闕圖漢玉雙印嚴分宜物沒入內府青緑商彛其餘秦漢珮環暨猫睛祖母緑俱璀璨琳琅如入縣圃有歙人王君正求見備陳賀氏之鼎願效居間斯時嵗聿云暮風雨載途賀既抱病杜門王亦徵書期迫各分手河梁未幾日獻云亡君正聞訃遄報仲和請圖此鼎仲和命之齎金懸購而鼎與觚俱屬金衢矣按宣和博古圖所載文王鼎銘七字曰魯公作文王尊彛史記魯世家云武王遍封同姓功臣戚者封周公旦於少昊之墟曲阜是為魯公以是推之此鼎當為周公作祭文王之器考之魯頌云乃命魯公俾侯於東則實伯禽就封制於宗廟以享其祖者也今觀鼎內篆止三字亦無文王之欵且輕重大小與宣和所藏迥異祗緣鼎足髣佛於圖乃强名之為文王鼎耳古器命名皆據銘文所有而題之如子父舉鼎南宫鼎之類不一而足今飛鳬家見鼎之方而古者即指為文王鼎焉習矣不察寧直見馬呼韓見牛呼戴而已周舉鼎考按古舉字也三代彛鼎有此文者頗多宋之僖公名舉楚有大夫伍舉皆周人今驗其名欵非宋僖公則伍大夫也觀其文質相宣翡翠欲滴為周器無疑周乳鐘戊子春余得古鐘於京口高四寸五分鈕高二寸濶二寸八分橫五寸三分重三斤十二兩無銘鈕蟠雙螭乳三十有六乃周器也文鏤典雅色裹翠羽扣之其聲鏗鏗頗乏霜中清越之響蓋厯年既久化銅成碧雖瑩玉質未振金聲如至人忘言神觀充悅德音中函莫可端倪余懸之架上於數千祀後尚存鳬氏典型祗以娛意而不以審音庶幾陶靖節之無絃琴耳余既得乳鐘佐以泗濵浮磬擊之鏘金戞玉餘韻悠揚鐘音淳古大叩小應反遜石音桓宣武云絲不如竹竹不如肉今乃知金不如石也金罍邑先輩鍾減亭鳴陛為河南永城令鄉民發古墓得金罍二後事發追之罍為減亭所得其子繼聲不才終風且暴剝其金而用之雖蝸涎蠡蝕尚存典型未為棄物繼聲蕩子摴蒱售之史玉池太史此萬厯間事崇禎壬申春仲余因襲蔭驅車北行至金陵而暫憩焉過晤於參將王澄海見其案上金罍充耳鼎足飾以金銀其小可置諸掌襄嵌雲雷細紋絲縈髮縷且質地精湛青緑內函外如𤣥玉璿璣文欵繡錯雲燦霞明竒器之竒莫竒於此余把玩良久心賞神怡元章袖中石豈可令楊次公見乎乃集詩銘之曰我有旨酒酌彼金罍充耳琇瑩如璋如圭於萬斯年莫不靜好適我願兮與子偕老余按罍之式有五山罍金罍大罍小罍水罍也諸侯大夫飾以黃金縷為雲雷取博施之象禮記曰宗廟之上罍尊在阼犧尊在西其為列侯上卿宴享之器無疑古玉奩天壤間神竒之器其函蓋之合雖遺失千秋終當復遇不但延津雙劍已也興化李彬齊太保石麓公孫有古玉奩乃商周間物其未出土時曾近銅器緑瀋數片侵入玉中融酥凝碧妙奪化工其式熊足充耳蓋蟠三螭驤首於雲紋中蜿蜒生動雕琢之工玲瓏古雅神彩陸離石麓傳之彬齊祗有奩而缺其蓋彬齊宦遊燕邸攜以自隨遇中州估人以古玉一囊求售皆琛璧珮觽零星瑰異中有玉蓋一枚與所藏之奩色澤惟肖彬齊見而躍然持入內室取奩合之渾然天成了無攜二驚喜逾涯不論直收之於是琬琰之名聞於遐邇逮彬齊有若敖之戚李氏羣從爭欲得之議久不決旋歸季因是而剖分其價焉余獲觀於因是齊中當為竒器甲觀宣和玉杯記宋宣和御府所藏玉杯三其一內外瑩潔絶無纖瑕杯口聳出螭頭小螭乘雲而起夭矯如生名教子升天真神物也二名八面玲瓏三則單螭作把外多花紋鈎碾精工瑩白過於教子而神彩稍遜其一其三向在雲間朱尚書旅溪家尚書之孫文巖及少愚各分得之文巖不能守以教子杯典吳門三百金已而從兄太史文石公諱大韶念玉杯為旅溪公故物倍價贖歸其單螭杯之在少愚處者久之亦歸文石文石居平晨起即科頭坐快閣上用五色筆批評古書數頁巾櫛後即把玩古彛鼎展名畫法書薄暮則設席欵客令歌僮度曲出所珍雙玉佐以文犀竒窰諸爵琳琅溢目坐客常滿與內弟平湖陸仲仁尤為親昵常對陸君云此杯乃宣和御苑所珍閲五百餘年而雙璧宛然供余𤣥賞不惟竒器良亦竒緣陸亦摩娑久之不忍釋手雖私艷慕不敢如米顛據舷也文石捐館無子立弟太學文泉子為嗣諸寶玉器則夫人平湖陸氏貯之熊祥閣中謹司管鑰外人不敢窺也萬厯壬午七月忽白光一道從閣上冉冉南去識者知為寶玉將散之兆未幾陸夫人暴殂陸宗族無不垂涎其家業者夫人之姪陸怡石妄稱陸氏中毒乃訟文泉於浙平湖劉令逮置圜扉衆瓜分其有時仲仁已為顯宦把持其間曰兩玉杯至文泉還矣於是亟取獻之杯至之夕文泉之室胡氏忿然曰夫君之禍此為􅑂耳睨杯欲擲之地左右失色請曰如主公何胡曰且休矣猶當辱之乃出錢二十五文沽村醪一樽斟杯中遍飲侍兒臧獲明日納之於陸遂議和而出文泉於獄越夕張筵欵文泉即將玉杯勸飲文泉歸而恨絶圖所報復力有不能惟嚴課其子冀以成名伊子果中甲榜仕為平湖令天啓間陸之子鍾奇少年任俠游於酒人因葉朗生謀叛罣議爰書將罹危法正屬朱令鞫獄生死懸於筆端朱陸舊係內姻不欲終置於理遣人謂鍾竒曰吾兩家久屬肺腑奈何因酒鎗微器而辱我先人楚弓不還則我先人含恨地下終無已也鍾竒逼在危迫且為讎家所執費及數萬金此杯雖則家傳非其好也亟還之朱君乃致祭於家廟令陸生手捧玉爵晉之几席祼酒三巡泣告於祖考曰而今而後可雪恥於九原矣并語陸生兹乃尤物吾兩家溺之幾陷叵測無貽患於後人也取椎擊之碎若迸珠仍保全鍾竒緩其吏議鍾竒改行從善仕為執金吾翡翠硯崇禎丙子余參南中府軍事樞務蕭閒與同寅諸君以登臨觴詠為事丁丑初春偕何青丘楊獻可郝東星觀梅靈谷時零雨初霽山水明秀玉雪亭亭芬馥十里夾道古松樛枝盤鬱山徑幽邃如行空翠中八功德水涓涓始流漱之清寒沁齒金陵蔣生為地主攜榼集花下出碧玉杯勸飲青丘謂坐客曰余家藏翡翠硯與此杯同色磨之以金霏霏成屑如硯中墨瀋先君湖廣隨州人內閣學士諱宗彥所遺世固稀有惜未攜來與君輩玩之未幾隨州破於流寇青丘之家蕩然矣歐文忠公歸田録云家有一玉罌梅聖俞以為碧玉真宗朝老內臣見而識之曰此寶器也謂之翡翠禁中有翡翠盞一隻所以識之公偶以金環磨於罌腹金屑紛紛而落始知翡翠之能屑金也正與青丘所藏同定窰鼎記定窰鼎乃宋器之最精者成𢎞間藏於吾邑河莊孫氏曲水山房有李西涯篆銘鐫於爐座曲水七峯昆仲乃朱陽賞鑑家與楊文襄文太史祝京兆唐解元稱莫逆西涯亦其友也孫於嘉靖間值倭變産日益落所蓄珍玩俱已轉徙兹鼎為京口靳尚寶伯齡所得毗陵唐太常凝菴負博雅名從靳購之遂歸於唐唐雖竒玩充牣此鼎一至諸品遜席自是海內評窰器者必首推唐氏之白定鼎云吳門周丹泉巧思過人交於太常每詣江西之景德鎮倣古式製器以眩耳食者紋欵色澤咄咄逼真非精於鑒别鮮不為魚目所混一日從金閶買舟往江右道經毗陵晉謁太常借閲此鼎以手度其分寸仍將片楮摹鼎紋袖之旁觀者未識其故解維以往半載而旋袖出一爐云君家白定爐我又得其一矣唐大駭以所藏較之無纖毫疑義盛以舊爐底蓋宛如輯瑞之合也詢何所自來周云余疇昔借觀以手度者再蓋審其大小輕重耳實倣為之不相欺也太常歎服售以四十金蓄為副本並藏於家萬厯末年淮安杜九如賈而多資以釣竒為名高出纍千金購求竒玩董𤣥宰之漢玉章劉海日之商金鼎咸歸之浮慕唐氏定爐形於寤寐太常之孫君俞豪華好客杜齎千金為壽必求兹鼎一觀以慰生平君俞出贋鼎戲之杜謂得未曾見如見帝青天寶强納千金以二百金酬居間者攜鼎以去君俞雖尚俠哉而居心頗願良不忍欺遣門下士告之曰吾子所取者贋鼎也真者尚在遵太常公戒不輕以示人子既捐千金而保贋品若雖不知余寧不愧於心乎杜反護前以為悔盟持之愈堅客曰子如不信請列二鼎並觀可乎杜猶疑信者半唐出真鼎示之若虬髯之遇文皇雖各具龍虎之表而神彩煥發自與常異也由此知九如不過葉公之好原非真賞君俞襟度過人逺矣九如沒傳於伊子生之有王廷珸者字越石慣居竒貨以博刀錐瞷杜生游平康以八百金供纒頭費逆料其無以償且示意不欲酬金而欲得爐也爐竟歸之詭稱其值萬金求售於徐六嶽徐惡其譎拒不納乃轉質於人十餘年間旋質旋贖紛如舉棋又求其族屬之相肖者方圓數種並置篋中多方壟斷泰興季因是企慕唐爐廷珸乃以一方者誑之售直五百季君以為名物而愈快焉毗陵趙再思舊游於唐稔知此鼎偶過泰興晤季季云近得一竒器乃唐氏名物方期請政而子適來誠良緣也趙生唯唯季問唐家定窰方鼎君曾見否趙生大笑曰唐之定鼎體圓而足三公云方鼎何居季廢然入內久不出趙生屏息以俟至暮出謂生曰此獠欺我南科屈靜源吾中州所取士今致書靜源道其事當為我處之屈君屬有司追理廷珸抱頭鼠竄挽人講解另以僞物償季僅免犴狴焉而黃黃石之事起黃石名正賔以資郎建言廷杖憑藉聲氣游於縉紳頗蓄鼎彛畫畫與廷珸同籍徽州稱中表互博易骨董以為娛正賔有倪雲林山水一幅估價百草金托廷珸轉售仍暗記花押於隱處廷珸心艷倪畫屬高手臨換待正賔取時即以橅本還之殊不知其有默記也正賔遣蒼頭佛元取畫裝潢宛然惟失花押佛元黠人也謬云主人不惟遣來取畫兼欲觀定爐且議價耳廷珸方授爐佛元而正賔亦至謂廷珸曰畫久不售應以原物歸我奈何作狡獪伎倆廷珸搏顙發誓正賔詰之曰吾有私記今安在正誚讓間佛元從傍執鼎兼以左右指摳鼎耳以示無還理廷珸奪之鼎墮地如裂瓦廷珸恨絶頭撞正賔傷脅時正賔被逐於𢎞光帝鬱鬱不樂又遭廷晤之侮越夕奄逝廷珸宵遁潜蹤於杭爾時潞藩寓杭聞定爐名遣承奉俞啓雲咨訪遇廷珸於湖上出贋鼎誇耀把臂甚歡恨相見晚引謁潞藩酬以二千金承奉私得四百以千六百金畀廷珸潞藩時在播遷之時主藏吏命一㕑役司管鑰其人頗椎鹵居無何王欲觀鼎㕑役啓匣取鼎戛然有聲忽折一足㕑役懼投水死已而有一承奉沈廢鼎於錢塘江中野史氏曰鼎乃重器以備清廟明堂之儀商周以來典型具在若夫越窰祕色昉於後周而三代無傳焉奈何以瓦缶之微與天球𢎞璧抗衡邪或曰虞之陶不在商周上乎然土硎汙樽昭其儉也非以示珍今宣成之器又將與定瓷競勝好事者趨之若狂良不可解中州玉璽天啓四年秋河南臨漳縣學生王思極王燦同鄉民邢一秦耕於漳河之濵忽風起水湧紅光旋繞視之地間閃出一玉古色璀璨黃白相宣重一百二十兩方各四寸面厚一寸二分高一寸八分龍鈕龜形乃傳國璽也其文曰受命於天既壽永昌龍飛鳳翥神彩陸離撫臣程紹具表進之副使張夢鯨則齎表官也夢鯨印成絹本攜至京師其時董𤣥宰為少宗伯得絹本藏之以為珍異進璽之日則十一月十三日天子御皇極殿受朝賀𫝊視廷臣頒賚撫臣以下有差得璽者僅賞銀五兩魏忠賢欲令天下有司赴京慶賀時同節家伯諱志禮為尚寶卿職掌符璽力阻其議大拂忠賢之意乃令科臣以年老劾歸同節雖硜執己見忤於權璫然免王程之驅馳省驛遞之搔擾為益多矣秦以藍田玉制傳國璽命李斯篆文王莽篡位使安陽侯王舜迫太后求之太后怒罵投之殿階一角微缺遞傳而至宋室靖康之變鼎彛圭璧蕩然一空元成宗時御史臺通事庫庫楚得之於故同知通政院事拾得家後被順帝攜入沙漠秦璽化為烏有先生久矣中州所得方稜無缺似非秦漢所傳或曰秦璽有六此其一也抑漢唐以來倣而制之邪夫嬴秦受命僅垂兩葉中州呈瑞隨見陸沈於傳國乎何有惟善為寶侯服且然況君天下者哉臨漳古鄴地魏都於此璽或曹氏所制秦漢印上海顧氏所藏漢銅玉印最多有印譜行世而實始於河莊之孫嘉靖間外大父石雲孫君好古博雅藏秦漢玉印三十餘方銅印七十餘方其鈕各異有龜鈕駝鈕鼻鈕又有陰陽子母等印石雲於秦漢魏晉六朝篆文類能辨之後為上海顧氏購得復次第購印三千有竒蓋由孫氏始也余曾見淮安杜九如家玉印二百餘方各甚精好中有無篆之章而鈕極佳亦因其鈕而存之耳俞容自先生有印癖收藏古印頗多參考最詳彚為印譜近俱散逸矣明印章印章之制始於秦而盛於漢然秪記姓名及官階耳至宋元始有齊名及别號逮明時風雅之士博綜篆籀鳥跡蝸涎游泳上古鐵筆之妙莫過於文三橋彭何雪漁震三橋如漢庭老吏字挾風霜雪漁如絳雲在霄舒卷自如徐髯仙霖許高陽初周公瑕天球皆係書家旁及篆體印文章法心畫精竒李長蘅流芳歸文休昌世以吐鳳之才擅雕蟲之技銀鉤屈曲施諸符信典雅縱橫梁千秋襄受業於何雪漁奏刀運腕饒有慧心亦後來之秀節慎庫銅缸崇禎間余承乏南起部郎曾綰庫篆見節慎庫中銅缸二隻云是沈萬山家物其形四方外多花紋色純黑如漆若世傳姜鑄之式鼎鳴余既解組歸偃臥林麓視舊遊為畏途丙戌秋因羣從赴南闈之試亦策蹇於秣陵逍遙登眺晤舊同寅董君德鏞閒談間始知别後適值兵興水衡之錢日應軍需猶虞不給且川湖道梗陡缺銅商凡內帑銅器悉充鼓鑄間有古色陸離者董君心知竒器然亦未敢議留有巨鼎三座俱重六七百斤輦至鑄厰將投熾炭命吏守之靜夜鼎各長鳴如虬吟幽壑頭陀文璞聞而惜之糾衆僧募銅赴部請易乃於碧峯報恩兩剎暨圓覺菴各置一鼎焉由此千秋重器脫火坑而登蓮域永鎮檀那矣石壁題名外大父七峯孫君吾陽高士也與唐六如祝希哲楊邃菴陳石亭張石川諸名彥稱莫逆交相思命駕羣賢畢集往往見之圖詠流傳人間孫氏所居之南山石壁竒峭屹立江湄正德庚辰嵗七峯與諸君修褉於石壁之下題名巖表鎸之以紀勝遊其懸崖揮翰者乃楊文襄也唐六如圖之兼題長歌於幀首雖西園雅集不是過也余追慕渭陽遣人搨之其磨崖之刻已半漶於風雨惟六如圖詠尚焜耀於天壤間七峯之藉以不朽者不在金石而在縑緗矣石壁題名詩六如集中未載今録於此以俟桑梓之彥如葛常之著韻語陽秋者採掇七峯山上多石壁虎踞龍蹲兼臥立有時斜疊波濤文蘚固苔封半乾濕主人乘興恣登臨不速長攜二三客臺閣山林半相雜一時謔浪皆文墨梯高躡險不肯辭淋漓每灑如扛筆深鐫淺刻動椎鑿從此長年費工力我也從旁記姓名太嵗庚辰年正德雖然汗漫一時事百年轉眼存舊跡試聽夜深風雨中應有鬼神驚且泣余和六如先生韻云石骨嶙峋露蒼壁一㸃芙蓉天外立江濤逆浸翠微寒雲氣長封苔蘚濕七峯高士嵇阮儔四座琳琅偏好客客星每動太史占雅集西園欣灑墨飛梯懸磴記芳名黃鶴靈芝攜鐵筆六如仙子染緗素五百年來扛鼎力畫圖三見嵗庚辰曾並磨崖傳正德千秋應有六丁護玉躞金題存舊跡只恐夜深風雨中虹光射斗蛟龍泣浪漱雲根驚峭壁靈鷲飛來江上立霜凝危岫薜蘿寒露墜空林松桂濕南山小隱真竒士北海清樽供上客燒餘竹瀝只烹茶磨遍松煤堪潑墨伯虎前身顧虎頭興酣盤礴方留筆掣管迅如風雨來驥渴鴻驚憑腕力石泐墨晶垂琬琰風雅不孤徵有德紀元前度是庚辰驚喜百年傳舊跡雲巒勾出蝌蚪文蒼頡書成鬼應泣南山小隱正德庚午祝京兆為河莊孫氏作南山小隱記文體華整書法端莊有雅人深致此亦吾鄉文獻足徴者卷乃素綾所書今藏文學孫家靈巗子石記余性好石尤好靈巖子石此種出六合靈巗山之澗中而聚於金陵余屐齒每及雨花桃葉間必博訪其上乘者貯之奚囊攜歸以古銅盤挹水注之日夕耽玩心怡神賞如坐蓬瀛見蛟蜃吐氣結成五色珠璣絢爛莫可名狀此石初為山靈所祕人未之知或樵夫牧豎過而拾之玩弄俄頃旋復棄擲惟與曉烟暮靄出沒於潺湲中而已萬厯丙申嵗米友石尹於兹邑簿書之暇觴詠於靈巗山見溪流中文石纍纍遣輿臺褰裳掇之則繽紛璀璨髮縷絲縈其色白如霏雪紫若蒸霞緑映逺山之黛黑洄瀚海之波黃琮可薦於虞廷赤文曾藏於禹穴更有天成魚鳥竹石暨大士應真如鏡涵影自然成文友石得未曾有詫為竒觀更具畚鍤採之重淵邑令所好風行景從源源而來多多益善自兹以往知音競賞珍竒琳琅想米顛袖中無此一種坡老怪石供不必取之齊安江上矣瑞雲峯震澤洞庭之麓産竒石焉宣和中朱勔得神運峰於黿山廣百圍高六仞殫東南民力運入汴京為艮嶽羣峰之長今姑蘇徐氏園之瑞雲峰亦其流亞也峯巒秀拔巗崿嵌空蒼潤嶙峋聳立林表初在王文恪别墅後歸太僕徐君徐營菟裘於吳門移置此石聨舟載之既至湖心風狂浪湧舟敗石沈於是寒波萬頃遙浸月華素練千層倒沈雲影狰獰淵底恆驚躍浪之鯨突兀波心長為秋水之骨犀然牛渚孰窺水府神竒劍入龍津莫測波臣變化徐君素有平泉之癖反為望石之夫廣募漁人泅於浩渺若蛋戶之探珠類舟人之求劍忽覺洪濤中崔巍影現倣佛似之乃編巨筏設絞車千夫競拽登之水湄則塊然如磐非復故物就而視之即斯石之座也徐君得魚思筌仍百計旁求冥搜於蛟闕漁人復於深潭揣得石骨越壑穿巗足指幾裂益以千尋絙索挽而出之如巨鰲載山橫截波面宛然原石也乃知神物㑹集確有機緣雲峯不沈磐石不出珠還璧合夫豈偶然韻石齊筆談卷上
